# GitHub Actions workflow: ONNX → RKNN (RK3588 INT8 + FP16)
# 用法：见 GITHUB_SETUP.md
# 说明：未提供校准图时，自动下载 COCO128（通用自然图像，含人物）作为 INT8 校准集，
#       因此「没有任何图」也能直接产出 INT8 模型；下载失败则降级为只产 FP16。
name: ONNX → RKNN (RK3588 INT8+FP16)

on:
  workflow_dispatch:    # 手动触发（网页按钮 + 输入参数表单）
    inputs:
      onnx_url:
        description: 'ONNX 文件的下载直链（GitHub Release 资产 URL 或任意 https 直链）'
        required: true
        type: string
      onnx_filename:
        description: '保存到 runner 时的文件名（建议带 .onnx 后缀）'
        required: true
        default: 'model.onnx'
        type: string
      target_size:
        description: '输入尺寸 height,width（逗号分隔；416,416 表示 416×416）'
        required: false
        default: '416,416'
        type: string
      calib_url:
        description: '校准图 zip 包直链（含 jpg/png；用于 INT8 量化）。留空=自动下载 COCO128 通用图当校准集，无需你提供任何图也能出 INT8'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert.yml'   # 仅当本文件变更才自动跑，避免死循环

jobs:
  convert:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ONNX_FILE: ${{ github.event.inputs.onnx_filename || 'model.onnx' }}
      TARGET_SIZE: ${{ github.event.inputs.target_size || '416,416' }}
      ONNX_URL: ${{ github.event.inputs.onnx_url || 'https://github.com/Chenys66/yolov5-rk3588/releases/download/v1.0/123.onnx' }}
      CALIB_URL: ${{ github.event.inputs.calib_url || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libhdf5-dev libgl1 libglib2.0-0 libgomp1

      - name: Setup Python 3.10
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Install RKNN Toolkit2 v2.3.2 wheel
        run: |
          pip install --quiet 'numpy<1.24' 'onnx<1.17' onnxruntime
          wget -q \
            "https://raw.githubusercontent.com/airockchip/rknn-toolkit2/master/rknn-toolkit2/packages/x86_64/rknn_toolkit2-2.3.2-cp310-cp310-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
          pip install --quiet \
            "rknn_toolkit2-2.3.2-cp310-cp310-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"

      - name: Download ONNX from URL
        run: |
          echo ">>> 下载 ONNX: $ONNX_URL"
          curl -fL --retry 3 -o "$ONNX_FILE" "$ONNX_URL"
          ls -la "$ONNX_FILE"

      - name: Inspect ONNX outputs & raw format
        run: |
          python3 - <<'PY'
          import os, numpy as np, onnx, onnxruntime as ort
          path = os.environ["ONNX_FILE"]
          print("=== ONNX 输出节点 ===")
          m = onnx.load(path)
          for o in m.graph.output:
              dims = [d.dim_value if d.dim_value else d.dim_param
                      for d in o.type.tensor_type.shape.dim]
              print(f"  name={o.name}  shape={dims}")
          sess = ort.InferenceSession(path, providers=["CPUExecutionProvider"])
          iname = sess.get_inputs()[0].name
          ishape = sess.get_inputs()[0].shape
          h, w = int(ishape[2]), int(ishape[3])
          print(f"[input] {iname} {ishape}")
          inp = np.zeros((1, 3, h, w), dtype=np.float32)   # 黑图，NCHW /255
          outs = sess.run(None, {iname: inp})
          for i, o in enumerate(outs):
              a = np.array(o)
              print(f"--- output[{i}] shape={a.shape}")
              if a.shape[-1] >= 7:
                  flat = a.reshape(-1, a.shape[-1])
                  obj = flat[:, 4]
                  xywh = flat[:, :4]
                  print(f"    obj  min/mean/max = {obj.min():.4f} / {obj.mean():.4f} / {obj.max():.4f}")
                  print(f"    obj>0.5 数量      = {(obj > 0.5).sum()}")
                  print(f"    xywh min/max      = {xywh.min():.4f} / {xywh.max():.4f}")
          print("判读：obj 若超出 0~1 范围 = raw logit（未 sigmoid）；xywh 若远小于输入尺寸 = raw 偏移（未解码绝对坐标）。")
          PY

      - name: Extract YOLOv5 anchors & strides from ONNX
        run: |
          python3 - <<'PY'
          import os, numpy as np, onnx
          path = os.environ["ONNX_FILE"]
          m = onnx.load(path)

          found = []
          for init in m.graph.initializer:
              arr = onnx.numpy_helper.to_array(init)
              n = init.name.lower()
              if "anchor" in n or arr.shape in [(3, 2), (9, 2), (1, 3, 1, 1, 2), (3, 1, 1, 2), (1, 3, 1, 1, 1, 2), (3, 1, 1, 1, 1, 2)]:
                  if arr.size in (6, 18):
                      print(f"[init] {init.name}  shape={arr.shape}  values={arr.flatten().tolist()}")
                      found.append(arr.reshape(-1, 2))
          for node in m.graph.node:
              if node.op_type != "Constant": continue
              for attr in node.attribute:
                  if attr.name != "value": continue
                  arr = onnx.numpy_helper.to_array(attr.t)
                  if "anchor" in (node.name or "").lower() or arr.shape in [(3, 2), (9, 2), (1, 3, 1, 1, 2), (3, 1, 1, 2), (1, 3, 1, 1, 1, 2), (3, 1, 1, 1, 1, 2)]:
                      if arr.size in (6, 18):
                          print(f"[const] {node.name}  shape={arr.shape}  values={arr.flatten().tolist()}")
                          found.append(arr.reshape(-1, 2))

          inp = m.graph.input[0]
          in_h = in_w = None
          for d in inp.type.tensor_type.shape.dim:
              if d.dim_value:
                  if in_h is None: in_h = d.dim_value
                  else: in_w = d.dim_value

          strides = []
          for o in m.graph.output:
              dims = [d.dim_value for d in o.type.tensor_type.shape.dim]
              if len(dims) == 5 and dims[1] == 3 and dims[-1] >= 5:
                  gy, gx = dims[2], dims[3]
                  if in_h and in_w:
                      sy, sx = in_h // gy, in_w // gx
                      strides.append(sx)
                      print(f"[stride] {o.name} grid={gx}x{gy}  → stride={sx}")
          print(f"[strides] {strides}")

          if found:
              for arr in found[:1]:
                  if arr.shape[0] == 9:
                      print(f"[anchors-P3 ] {arr[:3].tolist()}")
                      print(f"[anchors-P4 ] {arr[3:6].tolist()}")
                      print(f"[anchors-P5 ] {arr[6:9].tolist()}")
                  else:
                      print(f"[anchors] 3 anchors: {arr.tolist()}")
          else:
              print("[anchors] NOT FOUND - 模型可能使用 YOLOv5 默认 anchors")
              print("[default-P3 ] [[10,13], [16,30], [33,23]]")
              print("[default-P4 ] [[30,61], [62,45], [59,119]]")
              print("[default-P5 ] [[116,90], [156,198], [373,326]]")
          PY

      - name: Prepare calibration dataset (auto-download if none provided)
        run: |
          mkdir -p calib
          if [ -n "$CALIB_URL" ]; then
            echo ">>> 使用你提供的校准集: $CALIB_URL"
            curl -fL --retry 3 -o calib.zip "$CALIB_URL" \
              || { echo "::error::校准图下载失败"; exit 1; }
            unzip -q -o calib.zip -d calib/ \
              || { echo "::error::校准图解压失败"; exit 1; }
          else
            echo ">>> 未提供校准图：自动下载 COCO128（通用自然图像，含人物场景）作为 INT8 校准集"
            curl -fL --retry 3 -o calib.zip \
              "https://github.com/ultralytics/yolov5/releases/download/v1.0/coco128.zip" \
              || { echo "::warning::COCO128 下载失败，将只产出 FP16 模型"; exit 0; }
            unzip -q -o calib.zip -d calib/ \
              || { echo "::warning::COCO128 解压失败，将只产出 FP16 模型"; exit 0; }
          fi
          # 收集所有 jpg/png/bmp/jpeg/webp 文件，写入 dataset.txt（RKNN 要求的格式）
          find calib -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.bmp" -o -iname "*.webp" \) | sort > dataset.txt
          N=$(wc -l < dataset.txt)
          echo ">>> 校准集: ${N} 张图"
          if [ "$N" -lt 10 ]; then
            echo "::warning::校准图偏少（${N} < 10），INT8 量化质量可能下降；建议后续用你的真实场景图替换。"
          fi
          head -3 dataset.txt

      - name: Convert ONNX to RKNN (3 raw heads, INT8+FP16)
        run: |
          python3 - <<'PY'
          import os, sys, onnx
          from rknn.api import RKNN

          onnx_path = os.environ["ONNX_FILE"]
          h, w = [int(x) for x in os.environ["TARGET_SIZE"].split(",")]
          print(f"[info] ONNX: {onnx_path}  ({os.path.getsize(onnx_path)/1024/1024:.1f} MB)")
          print(f"[info] 输入尺寸: {h}x{w}, 目标: rk3588")

          # V7: GUI 只支持 1/2/3/6/9 输出。 123.onnx 有 4 输出 (output + 339 + 391 + 443)。
          #     取 3 个 raw head (339/391/443) → 对应 GUI 的 "3-output YOLOv5 raw3" 格式。
          #     丢掉多余的 output 节点（已解码，GUI 会二次解码 → 必坏）。
          m = onnx.load(onnx_path)
          shapes = {o.name: [d.dim_value for d in o.type.tensor_type.shape.dim] for o in m.graph.output}
          heads = sorted([n for n, s in shapes.items() if len(s) == 5 and s[1] == 3 and s[-1] == 7],
                         key=lambda n: -shapes[n][2])   # P3(52) -> P4(26) -> P5(13)
          print(f"[heads] {heads}")

          has_calib = os.path.exists("dataset.txt")
          n_calib = 0
          if has_calib:
              with open("dataset.txt") as f:
                  paths = [ln.strip() for ln in f if ln.strip()]
              n_calib = len(paths)
          print(f"[calib] {'yes ('+str(n_calib)+' images)' if has_calib else 'no → 跳过 INT8'}")

          # 输入配置：std=255（与第三方验证可用的 raw_int8_rk3588.rknn 一致，与你 GUI 喂原图一致）
          configs = [
              ("fp16", False, None, "123_rk3588_fp16_raw3.rknn"),
          ]
          if has_calib:
              configs.append(("int8", True, "dataset.txt", "123_rk3588_int8_raw3.rknn"))

          for tag, do_q, dataset, out_name in configs:
              print(f"\n===== {tag}: outputs={heads} do_quantization={do_q} =====")
              rknn = RKNN(verbose=True)
              rknn.config(
                  target_platform='rk3588',
                  mean_values=[[0, 0, 0]],
                  std_values=[[255, 255, 255]]
              )
              ret = rknn.load_onnx(
                  model=onnx_path,
                  inputs=['images'],
                  outputs=heads,
                  input_size_list=[[1, 3, h, w]]
              )
              if ret != 0:
                  sys.exit(f"load_onnx failed (ret={ret})")
              kwargs = {"do_quantization": do_q}
              if dataset:
                  kwargs["dataset"] = dataset
              ret = rknn.build(**kwargs)
              if ret != 0:
                  sys.exit(f"build failed (ret={ret})")
              ret = rknn.export_rknn(out_name)
              if ret != 0:
                  sys.exit(f"export_rknn failed (ret={ret})")
              print(f"[ok] 生成: {out_name}  ({os.path.getsize(out_name)/1024/1024:.1f} MB)")
              rknn.release()
          PY

      - name: Upload .rknn as artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: rknn-model
          path: ./*.rknn
          if-no-files-found: error
          retention-days: 14
