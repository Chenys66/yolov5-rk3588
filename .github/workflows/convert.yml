# GitHub Actions workflow: ONNX → RKNN (RK3588 FP16)
name: ONNX → RKNN (RK3588 FP16)

on:
  workflow_dispatch:
    inputs:
      onnx_url:
        description: 'ONNX 文件的下载直链'
        required: true
        type: string
      onnx_filename:
        description: '保存到 runner 时的文件名（建议带 .onnx 后缀）'
        required: true
        default: 'model.onnx'
        type: string
      target_size:
        description: '输入尺寸 height,width（416,416 = 416×416）'
        required: false
        default: '416,416'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert.yml'

jobs:
  convert:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ONNX_FILE: ${{ github.event.inputs.onnx_filename || 'model.onnx' }}
      TARGET_SIZE: ${{ github.event.inputs.target_size || '416,416' }}
      ONNX_URL: ${{ github.event.inputs.onnx_url || 'https://github.com/Chenys66/yolov5-rk3588/releases/download/v1.0/123.onnx' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libhdf5-dev libgl1 libglib2.0-0 libgomp1

      - name: Setup Python 3.10
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Install RKNN Toolkit2 v2.3.2 wheel
        run: |
          pip install --quiet 'numpy<1.24' 'onnx<1.17' onnxruntime
          wget -q "https://raw.githubusercontent.com/airockchip/rknn-toolkit2/master/rknn-toolkit2/packages/x86_64/rknn_toolkit2-2.3.2-cp310-cp310-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
          pip install --quiet "rknn_toolkit2-2.3.2-cp310-cp310-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"

      - name: Download ONNX from URL
        run: |
          echo ">>> 下载 ONNX: $ONNX_URL"
          curl -fL --retry 3 -o "$ONNX_FILE" "$ONNX_URL"
          ls -la "$ONNX_FILE"

      - name: Inspect ONNX outputs & raw format
        run: |
          python3 - <<'PY'
          import os, numpy as np, onnx, onnxruntime as ort
          path = os.environ["ONNX_FILE"]
          print("=== ONNX 输出节点 ===")
          m = onnx.load(path)
          for o in m.graph.output:
              dims = [d.dim_value if d.dim_value else d.dim_param
                      for d in o.type.tensor_type.shape.dim]
              print(f"  name={o.name}  shape={dims}")
          sess = ort.InferenceSession(path, providers=["CPUExecutionProvider"])
          iname = sess.get_inputs()[0].name
          ishape = sess.get_inputs()[0].shape
          h, w = int(ishape[2]), int(ishape[3])
          print(f"[input] {iname} {ishape}")
          inp = np.zeros((1, 3, h, w), dtype=np.float32)
          outs = sess.run(None, {iname: inp})
          for i, o in enumerate(outs):
              a = np.array(o)
              print(f"--- output[{i}] shape={a.shape}")
              if a.shape[-1] >= 7:
                  flat = a.reshape(-1, a.shape[-1])
                  obj = flat[:, 4]
                  xywh = flat[:, :4]
                  print(f"    obj  min/mean/max = {obj.min():.4f} / {obj.mean():.4f} / {obj.max():.4f}")
                  print(f"    obj>0.5 数量      = {(obj > 0.5).sum()}")
                  print(f"    xywh min/max      = {xywh.min():.4f} / {xywh.max():.4f}")
          print("判读：obj 若超出 0~1 = raw logit；xywh 远小于输入尺寸 = raw 偏移（未解码）。")
          PY

      - name: Convert ONNX to RKNN (FP16)
        run: |
          python3 - <<'PY'
          import os, sys, onnx
          from rknn.api import RKNN

          onnx_path = os.environ["ONNX_FILE"]
          h, w = [int(x) for x in os.environ["TARGET_SIZE"].split(",")]
          print(f"[info] ONNX: {onnx_path}  ({os.path.getsize(onnx_path)/1024/1024:.1f} MB)")
          print(f"[info] 输入尺寸: {h}x{w}, 目标: rk3588, 量化: FP16")

          m = onnx.load(onnx_path)

          base = os.path.splitext(os.path.basename(onnx_path))[0]

          # V5: 根因=输入归一化。GUI 喂 uint8 [0,255]，模型训练在 [0,1]，
          #      std=[[255,255,255]] 让 RKNN 喂网前自动 (x-0)/255，与 GUI 如何喂数据无关。
          out_defs = [(o.name, [d.dim_value for d in o.type.tensor_type.shape.dim])
                      for o in m.graph.output]

          def _size(s):
              p = 1
              for v in s:
                  if v > 0: p *= v
              return p

          single_cands = [(n, s) for n, s in out_defs if len(s) >= 3 and s[-1] == 7]
          single_name = max(single_cands, key=lambda x: _size(x[1]))[0] if single_cands else 'output'
          multi_names = [n for n, s in out_defs if len(s) == 5 and s[1] == 3 and s[-1] == 7]
          print(f"[outputs] single={single_name}  multi={multi_names}")

          variants = [
              ("single", [single_name], [[0, 0, 0]], [[255, 255, 255]]),
          ]
          if multi_names:
              variants.append(("multi", multi_names, [[0, 0, 0]], [[255, 255, 255]]))

          for tag, out_list, mean, std in variants:
              print(f"\n===== 配置 {tag}: outputs={out_list} =====")
              rknn = RKNN(verbose=True)
              rknn.config(target_platform='rk3588', mean_values=mean, std_values=std)
              ret = rknn.load_onnx(model=onnx_path, inputs=['images'], outputs=out_list, input_size_list=[[1, 3, h, w]])
              if ret != 0: sys.exit(f"load_onnx failed (ret={ret})")
              ret = rknn.build(do_quantization=False)
              if ret != 0: sys.exit(f"build failed (ret={ret})")
              out_name = f"{base}_rk3588_fp16_v5_{tag}.rknn"
              ret = rknn.export_rknn(out_name)
              if ret != 0: sys.exit(f"export_rknn failed (ret={ret})")
              print(f"[ok] 生成: {out_name}  ({os.path.getsize(out_name)/1024/1024:.1f} MB)")
              rknn.release()
          PY

      - name: Upload .rknn as artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: rknn-model
          path: ./*.rknn
          if-no-files-found: error
          retention-days: 14
