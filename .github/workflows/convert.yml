# ============================================================
#  YOLOv5 416 → RKNN (RK3588) · raw3 专用 · 云端转换
#  修正版：只转 3 个 raw 输出(52/26/13)，不转端到端 decode，
#         通过软件 "3-output YOLOv5 raw3" 校验。
#  支持 FP16（无损）与 INT8（15ms 目标）两种量化。
#  用法：fork/新建仓库 → Actions → Run workflow → 填 onnx_url
# ============================================================
name: ONNX → RKNN raw3 (RK3588)

on:
  workflow_dispatch:
    inputs:
      onnx_url:
        description: 'ONNX 文件下载直链（必须为 .onnx 结尾）'
        required: true
        type: string
      target_size:
        description: '输入尺寸 height,width'
        required: false
        default: '416,416'
        type: string
      mode:
        description: '量化模式：fp16（无损）/ int8（15ms 目标，用合成校准图）/ both（两个都转）'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - fp16
          - int8

jobs:
  convert:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ONNX_URL: ${{ github.event.inputs.onnx_url }}
      TARGET_SIZE: ${{ github.event.inputs.target_size || '416,416' }}
      MODE: ${{ github.event.inputs.mode || 'both' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libhdf5-dev libgl1 libglib2.0-0 libgomp1

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install RKNN Toolkit2 v2.3.2
        run: |
          pip install --quiet 'numpy<1.24' 'onnx<1.17' onnxruntime opencv-python-headless pillow
          wget -q "https://raw.githubusercontent.com/airockchip/rknn-toolkit2/master/rknn-toolkit2/packages/x86_64/rknn_toolkit2-2.3.2-cp310-cp310-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
          pip install --quiet "rknn_toolkit2-2.3.2-cp310-cp310-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"

      - name: Download ONNX
        run: |
          curl -fL --retry 3 -o model.onnx "$ONNX_URL"
          ls -la model.onnx

      - name: Generate synthetic calibration set (INT8)
        if: env.MODE != 'fp16'
        run: |
          python3 - <<'PY'
          import os, random
          import numpy as np
          from PIL import Image, ImageDraw
          random.seed(42); np.random.seed(42)
          os.makedirs("calib", exist_ok=True)
          S = 416
          lines = []
          for i in range(200):
              arr = np.random.randint(40, 220, (S, S, 3), dtype=np.uint8)
              img = Image.fromarray(arr); d = ImageDraw.Draw(img)
              for _ in range(random.randint(1, 5)):
                  c = tuple(random.randint(0,255) for _ in range(3))
                  x, y = random.randint(0, S-80), random.randint(0, S-80)
                  if random.random() < 0.5:
                      r = random.randint(15, 80)
                      d.ellipse([x-r, y-r, x+r, y+r], fill=c)
                  else:
                      d.rectangle([x, y, x+random.randint(40,120), y+random.randint(40,120)], fill=c)
              fn = f"calib/calib_{i:03d}.jpg"
              img.save(fn, quality=92)
              lines.append(f"{os.path.abspath(fn)}")
          with open("dataset.txt", "w") as f:
              f.write("\n".join(lines))
          print(f"[calib] 已生成 {len(lines)} 张合成校准图 + dataset.txt")
          PY

      - name: Convert ONNX → RKNN (raw3)
        run: |
          python3 - <<'PY'
          import os, sys, numpy as np, onnx
          from rknn.api import RKNN

          onnx_path = "model.onnx"
          h, w = [int(x) for x in os.environ["TARGET_SIZE"].split(",")]
          mode = os.environ["MODE"]
          m = onnx.load(onnx_path)

          # 只取 raw 输出：5 维 [1,3,H,W,7]（52/26/13 三层）→ 软件要求 "3-output raw3"
          raw_names = [o.name for o in m.graph.output
                       if len(o.type.tensor_type.shape.dim) == 5
                       and o.type.tensor_type.shape.dim[1].dim_value == 3
                       and o.type.tensor_type.shape.dim[-1].dim_value == 7]
          if len(raw_names) != 3:
              raise SystemExit(f"ERROR: 期望 3 个 raw 输出，实际 {len(raw_names)}: {raw_names}")
          print(f"[outputs] raw3 = {raw_names}")

          targets = ["fp16", "int8"] if mode == "both" else [mode]
          for tag in targets:
              print(f"\n===== 转换 {tag} =====")
              rknn = RKNN(verbose=True)
              cfg = dict(
                  mean_values=[[0, 0, 0]], std_values=[[255, 255, 255]],
                  target_platform="rk3588", inputs=["images"],
                  input_size_list=[[1, 3, h, w]], optimization_level=3,
              )
              if tag == "fp16":
                  cfg["quantized_dtype"] = "fp16"
              else:
                  cfg["quantized_dtype"] = "w8a8"
                  cfg["quantized_algorithm"] = "mmse"
                  cfg["quantized_method"] = "channel"
              ret = rknn.config(**cfg)
              assert ret == 0, f"config failed: {ret}"

              ret = rknn.load_onnx(model=onnx_path, inputs=["images"],
                                   outputs=raw_names, input_size_list=[[1, 3, h, w]])
              assert ret == 0, f"load_onnx failed: {ret}"

              if tag == "fp16":
                  ret = rknn.build(do_quantization=False)
              else:
                  assert os.path.exists("dataset.txt"), "缺少 dataset.txt"
                  ret = rknn.build(do_quantization=True, dataset="dataset.txt", rknn_batchsize=-1)
              assert ret == 0, f"build failed: {ret}"

              out_name = f"yolov5_raw3_{tag}.rknn"
              ret = rknn.export_rknn(out_name)
              assert ret == 0, f"export failed: {ret}"
              print(f"[OK] 生成 {out_name} ({os.path.getsize(out_name)/1024/1024:.1f} MB)")

              # 模拟器验证：3 个输出 + 形状正确
              print(f"[verify] {tag} 模拟器推理验证...")
              v = RKNN(verbose=False)
              v.load_rknn(out_name)
              v.init_runtime()
              outs = v.inference(inputs=[np.random.rand(1,3,h,w).astype(np.float32)*2-1])
              assert len(outs) == 3, f"输出数量 {len(outs)} != 3"
              for o in outs:
                  assert np.array(o).shape[-1] == 7, f"输出最后一维不是7: {np.array(o).shape}"
              print(f"[verify] 通过：3 个输出，形状正确")
              v.release()
              rknn.release()

      - name: Upload RKNN
        uses: actions/upload-artifact@v4
        with:
          name: rknn-raw3
          path: ./*.rknn
          if-no-files-found: error
          retention-days: 14
