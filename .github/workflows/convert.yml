# GitHub Actions workflow: ONNX → RKNN (RK3588 INT8 + FP16)
# 用法：见 GITHUB_SETUP.md
# 说明：未提供校准图时，自动下载 COCO128（通用自然图像，含人物）作为 INT8 校准集，
#       因此「没有任何图」也能直接产出 INT8 模型；下载失败则降级为只产 FP16。
name: ONNX → RKNN (RK3588 INT8+FP16)

on:
  workflow_dispatch:    # 手动触发（网页按钮 + 输入参数表单）
    inputs:
      onnx_url:
        description: 'ONNX 文件的下载直链（GitHub Release 资产 URL 或任意 https 直链）'
        required: true
        type: string
      onnx_filename:
        description: '保存到 runner 时的文件名（建议带 .onnx 后缀）'
        required: true
        default: 'model.onnx'
        type: string
      target_size:
        description: '输入尺寸 height,width（逗号分隔；416,416 表示 416×416）'
        required: false
        default: '416,416'
        type: string
      calib_url:
        description: '校准图 zip 包直链（含 jpg/png；用于 INT8 量化）。留空=自动下载 COCO128 通用图当校准集，无需你提供任何图也能出 INT8'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert.yml'   # 仅当本文件变更才自动跑，避免死循环

jobs:
  convert:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ONNX_FILE: ${{ github.event.inputs.onnx_filename || 'model.onnx' }}
      TARGET_SIZE: ${{ github.event.inputs.target_size || '416,416' }}
      ONNX_URL: ${{ github.event.inputs.onnx_url || 'https://github.com/Chenys66/yolov5-rk3588/releases/download/v1.0/123.onnx' }}
      CALIB_URL: ${{ github.event.inputs.calib_url || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libhdf5-dev libgl1 libglib2.0-0 libgomp1

      - name: Setup Python 3.10
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Install RKNN Toolkit2 v2.3.2 wheel
        run: |
          pip install --quiet 'numpy<1.24' 'onnx<1.17' onnxruntime
          wget -q \
            "https://raw.githubusercontent.com/airockchip/rknn-toolkit2/master/rknn-toolkit2/packages/x86_64/rknn_toolkit2-2.3.2-cp310-cp310-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
          pip install --quiet \
            "rknn_toolkit2-2.3.2-cp310-cp310-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"

      - name: Download ONNX from URL
        run: |
          echo ">>> 下载 ONNX: $ONNX_URL"
          curl -fL --retry 3 -o "$ONNX_FILE" "$ONNX_URL"
          ls -la "$ONNX_FILE"

      - name: Inspect ONNX outputs & raw format
        run: |
          python3 - <<'PY'
          import os, numpy as np, onnx, onnxruntime as ort
          path = os.environ["ONNX_FILE"]
          print("=== ONNX 输出节点 ===")
          m = onnx.load(path)
          for o in m.graph.output:
              dims = [d.dim_value if d.dim_value else d.dim_param
                      for d in o.type.tensor_type.shape.dim]
              print(f"  name={o.name}  shape={dims}")
          sess = ort.InferenceSession(path, providers=["CPUExecutionProvider"])
          iname = sess.get_inputs()[0].name
          ishape = sess.get_inputs()[0].shape
          h, w = int(ishape[2]), int(ishape[3])
          print(f"[input] {iname} {ishape}")
          inp = np.zeros((1, 3, h, w), dtype=np.float32)   # 黑图，NCHW /255
          outs = sess.run(None, {iname: inp})
          for i, o in enumerate(outs):
              a = np.array(o)
              print(f"--- output[{i}] shape={a.shape}")
              if a.shape[-1] >= 7:
                  flat = a.reshape(-1, a.shape[-1])
                  obj = flat[:, 4]
                  xywh = flat[:, :4]
                  print(f"    obj  min/mean/max = {obj.min():.4f} / {obj.mean():.4f} / {obj.max():.4f}")
                  print(f"    obj>0.5 数量      = {(obj > 0.5).sum()}")
                  print(f"    xywh min/max      = {xywh.min():.4f} / {xywh.max():.4f}")
          print("判读：obj 若超出 0~1 范围 = raw logit（未 sigmoid）；xywh 若远小于输入尺寸 = raw 偏移（未解码绝对坐标）。")
          PY

      - name: Extract YOLOv5 anchors & strides from ONNX
        run: |
          python3 - <<'PY'
          import os, numpy as np, onnx
          path = os.environ["ONNX_FILE"]
          m = onnx.load(path)

          found = []
          for init in m.graph.initializer:
              arr = onnx.numpy_helper.to_array(init)
              n = init.name.lower()
              if "anchor" in n or arr.shape in [(3, 2), (9, 2), (1, 3, 1, 1, 2), (3, 1, 1, 2), (1, 3, 1, 1, 1, 2), (3, 1, 1, 1, 1, 2)]:
                  if arr.size in (6, 18):
                      print(f"[init] {init.name}  shape={arr.shape}  values={arr.flatten().tolist()}")
                      found.append(arr.reshape(-1, 2))
          for node in m.graph.node:
              if node.op_type != "Constant": continue
              for attr in node.attribute:
                  if attr.name != "value": continue
                  arr = onnx.numpy_helper.to_array(attr.t)
                  if "anchor" in (node.name or "").lower() or arr.shape in [(3, 2), (9, 2), (1, 3, 1, 1, 2), (3, 1, 1, 2), (1, 3, 1, 1, 1, 2), (3, 1, 1, 1, 1, 2)]:
                      if arr.size in (6, 18):
                          print(f"[const] {node.name}  shape={arr.shape}  values={arr.flatten().tolist()}")
                          found.append(arr.reshape(-1, 2))

          inp = m.graph.input[0]
          in_h = in_w = None
          for d in inp.type.tensor_type.shape.dim:
              if d.dim_value:
                  if in_h is None: in_h = d.dim_value
                  else: in_w = d.dim_value

          strides = []
          for o in m.graph.output:
              dims = [d.dim_value for d in o.type.tensor_type.shape.dim]
              if len(dims) == 5 and dims[1] == 3 and dims[-1] >= 5:
                  gy, gx = dims[2], dims[3]
                  if in_h and in_w:
                      sy, sx = in_h // gy, in_w // gx
                      strides.append(sx)
                      print(f"[stride] {o.name} grid={gx}x{gy}  → stride={sx}")
          print(f"[strides] {strides}")

          if found:
              for arr in found[:1]:
                  if arr.shape[0] == 9:
                      print(f"[anchors-P3 ] {arr[:3].tolist()}")
                      print(f"[anchors-P4 ] {arr[3:6].tolist()}")
                      print(f"[anchors-P5 ] {arr[6:9].tolist()}")
                  else:
                      print(f"[anchors] 3 anchors: {arr.tolist()}")
          else:
              print("[anchors] NOT FOUND - 模型可能使用 YOLOv5 默认 anchors")
              print("[default-P3 ] [[10,13], [16,30], [33,23]]")
              print("[default-P4 ] [[30,61], [62,45], [59,119]]")
              print("[default-P5 ] [[116,90], [156,198], [373,326]]")
          PY

      - name: Prepare calibration dataset (auto-download if none provided)
        run: |
          mkdir -p calib
          if [ -n "$CALIB_URL" ]; then
            echo ">>> 使用你提供的校准集: $CALIB_URL"
            curl -fL --retry 3 -o calib.zip "$CALIB_URL" \
              || { echo "::error::校准图下载失败"; exit 1; }
            unzip -q -o calib.zip -d calib/ \
              || { echo "::error::校准图解压失败"; exit 1; }
          else
            echo ">>> 未提供校准图：自动下载 COCO128（通用自然图像，含人物场景）作为 INT8 校准集"
            curl -fL --retry 3 -o calib.zip \
              "https://github.com/ultralytics/yolov5/releases/download/v1.0/coco128.zip" \
              || { echo "::warning::COCO128 下载失败，将只产出 FP16 模型"; exit 0; }
            unzip -q -o calib.zip -d calib/ \
              || { echo "::warning::COCO128 解压失败，将只产出 FP16 模型"; exit 0; }
          fi
          # 收集所有 jpg/png/bmp/jpeg/webp 文件，写入 dataset.txt（RKNN 要求的格式）
          find calib -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.bmp" -o -iname "*.webp" \) | sort > dataset.txt
          N=$(wc -l < dataset.txt)
          echo ">>> 校准集: ${N} 张图"
          if [ "$N" -lt 10 ]; then
            echo "::warning::校准图偏少（${N} < 10），INT8 量化质量可能下降；建议后续用你的真实场景图替换。"
          fi
          head -3 dataset.txt

      - name: Convert ONNX to RKNN (multi-layout single output, INT8+FP16)
        run: |
          python3 - <<'PY'
          import os, sys, onnx, numpy as np
          from onnx import helper, numpy_helper, TensorProto as T
          from rknn.api import RKNN

          onnx_path = os.environ["ONNX_FILE"]
          h, w = [int(x) for x in os.environ["TARGET_SIZE"].split(",")]
          print(f"[info] ONNX: {onnx_path}  ({os.path.getsize(onnx_path)/1024/1024:.1f} MB)")

          m = onnx.load(onnx_path)
          g = m.graph
          shapes = {o.name: [d.dim_value for d in o.type.tensor_type.shape.dim] for o in g.output}
          heads = sorted([n for n, s in shapes.items() if len(s) == 5 and s[1] == 3 and s[-1] == 7],
                         key=lambda n: -shapes[n][2])   # P3(52) -> P4(26) -> P5(13)
          print(f"[heads] {heads}")
          main_out = 'output' if 'output' in shapes else heads[0]
          print(f"[main output node] {main_out} shape={shapes.get(main_out)}")

          # ---- 构造 raw_concat [1,N,7] (3 个 raw head 拼) ----
          shape_init = numpy_helper.from_array(np.array([1, -1, 7], dtype=np.int64), name="rawc_shape")
          g.initializer.append(shape_init)
          reshaped = []
          for i, hd in enumerate(heads):
              rn = f"rawc_reshape_{i}"
              g.node.append(helper.make_node("Reshape", [hd, "rawc_shape"], [rn]))
              reshaped.append(rn)
          g.node.append(helper.make_node("Concat", reshaped, ["rawc_concat"], axis=1))
          g.output.append(helper.make_tensor_value_info("rawc_concat", T.FLOAT, [1, 10647, 7]))

          # ---- 通用：从 [1,N,7] 源张量构造 [1,N,6] (xywh + obj + max_cls) ----
          def make_6ch(mm, gg, source, prefix):
              ax = numpy_helper.from_array(np.array([2], dtype=np.int64), name=prefix + "_ax")
              gg.initializer.append(ax)
              for nm, sl, el in [("xywh", 0, 4), ("obj", 4, 5), ("cls", 5, 7)]:
                  s = numpy_helper.from_array(np.array([sl], dtype=np.int64), name=prefix + "_s_" + nm)
                  e = numpy_helper.from_array(np.array([el], dtype=np.int64), name=prefix + "_e_" + nm)
                  gg.initializer.append(s); gg.initializer.append(e)
                  gg.node.append(helper.make_node("Slice", [source, prefix + "_s_" + nm, prefix + "_e_" + nm, prefix + "_ax"], [prefix + "_" + nm]))
              gg.node.append(helper.make_node("ReduceMax", [prefix + "_cls"], [prefix + "_maxcls"], axes=[2], keepdims=1))
              out6 = prefix + "_6ch"
              gg.node.append(helper.make_node("Concat", [prefix + "_xywh", prefix + "_obj", prefix + "_maxcls"], [out6], axis=2))
              gg.output.append(helper.make_tensor_value_info(out6, T.FLOAT, [1, 10647, 6]))
              return out6

          rc6 = make_6ch(m, g, "rawc_concat", "rc")           # raw 拼 + 合类 -> [1,N,6]
          m2 = onnx.load(onnx_path); g2 = m2.graph
          dec6 = make_6ch(m2, g2, main_out, "dec")            # 已解码 output + 合类 -> [1,N,6]
          # 清理 graph.output，只保留本文件用到的输出，避免 RKNN 处理无关节点
          g.output[:]  = [o for o in g.output if o.name in ("rawc_concat", rc6)]
          g2.output[:] = [o for o in g2.output if o.name in (main_out, dec6)]
          raw_onnx = "raw_concat.onnx";  onnx.save(m, raw_onnx)
          dec_onnx = "dec_concat.onnx";  onnx.save(m2, dec_onnx)
          print(f"[ok] raw7/raw6 -> {raw_onnx}; dec7 -> {onnx_path}; dec6 -> {dec_onnx}")

          has_calib = os.path.exists("dataset.txt")
          print(f"[calib] {'yes' if has_calib else 'no'}")

          # 四个布局变体，覆盖 raw-vs-decoded x 7ch-vs-6ch 两个轴，std 固定 255（已确认正确）
          variants = [
              ("single_raw7", raw_onnx, "rawc_concat", "raw head 拼 [1,N,7] (pre-sigmoid logits)"),
              ("single_raw6", raw_onnx, rc6,           "raw head 拼 + 合类 [1,N,6]"),
              ("single_dec7", onnx_path, main_out,     "模型自带 output 节点 [1,N,7] (已解码)"),
              ("single_dec6", dec_onnx,  dec6,         "output 节点 + 合类 [1,N,6] (已解码)"),
          ]
          qtypes = [("int8", True), ("fp16", False)] if has_calib else [("fp16", False)]
          for tag, model, out_node, desc in variants:
              for qtag, do_q in qtypes:
                  full = f"123_rk3588_{tag}_{qtag}.rknn"
                  print(f"\n===== {tag} [{qtag}] std=255 out={out_node}  ({desc}) =====")
                  rknn = RKNN(verbose=True)
                  rknn.config(target_platform='rk3588', mean_values=[[0, 0, 0]], std_values=[[255, 255, 255]])
                  ret = rknn.load_onnx(model=model, inputs=['images'], outputs=[out_node], input_size_list=[[1, 3, h, w]])
                  if ret != 0:
                      sys.exit(f"load_onnx failed {tag}: {ret}")
                  kwargs = {"do_quantization": do_q}
                  if do_q:
                      kwargs["dataset"] = "dataset.txt"
                  ret = rknn.build(**kwargs)
                  if ret != 0:
                      sys.exit(f"build failed {tag}: {ret}")
                  ret = rknn.export_rknn(full)
                  if ret != 0:
                      sys.exit(f"export_rknn failed {tag}: {ret}")
                  print(f"[ok] 生成: {full}  ({os.path.getsize(full)/1024/1024:.1f} MB)")
                  rknn.release()

          print("\n>>> 四个变体说明（在 GUI 上各导入一次，看哪个出真目标/假目标最少）：")
          print("    single_raw7 : 旧方案（预期仍 18 假目标，作对照）")
          print("    single_raw6 : raw 合类成 6 通道")
          print("    single_dec7 : 直接用模型已解码 output（最值得试的新方向）")
          print("    single_dec6 : 已解码 + 合类 6 通道")
          PY

      - name: ONNX baseline detection count (诊断假目标来源)
        run: |
          echo ">>> 在 CI 上用 onnxruntime 跑同一张图，统计出框数"
          pip install -q pillow
          python3 - <<'PY'
          import os, glob
          import numpy as np
          import onnx
          import onnxruntime as ort
          from PIL import Image

          onnx_path = os.environ["ONNX_FILE"]
          h, w = [int(x) for x in os.environ["TARGET_SIZE"].split(",")]

          # 取 calib 目录任意一张图当样本；没有则用纯黑图
          cand = sorted(glob.glob("calib/*.*")) + sorted(glob.glob("calib/**/*.*", recursive=True))
          cand = [p for p in cand if p.lower().endswith((".jpg", ".jpeg", ".png", ".bmp"))]
          img_path = None
          for p in cand:
              try:
                  Image.open(p).convert("RGB"); img_path = p; break
              except Exception:
                  continue
          if img_path:
              img = Image.open(img_path).convert("RGB").resize((w, h))
              x = np.asarray(img, dtype=np.float32)[None] / 255.0
              x = np.transpose(x, (0, 3, 1, 2))
          else:
              x = np.zeros((1, 3, h, w), dtype=np.float32)
          print(f">>> 样本图: {img_path or '(纯黑)'}  input shape={x.shape}")

          sess = ort.InferenceSession(onnx_path, providers=["CPUExecutionProvider"])
          outs = {o.name: o for o in sess.get_outputs()}
          feed = {"images": x.astype(np.float32)}
          main_out = sess.run([outs["output"].name], feed)[0]
          print(f">>> main output shape={main_out.shape}  range=[{main_out.min():.3f},{main_out.max():.3f}]")

          def nms_count(t, conf_th=0.5):
              pred = t[0]
              obj = pred[:, 4]
              cls = pred[:, 5:].max(axis=1)
              score = obj * cls
              mask = score > conf_th
              if not mask.any():
                  return 0
              xs = pred[mask, 0]; ys = pred[mask, 1]
              ww = pred[mask, 2]; hh = pred[mask, 3]
              x1 = xs - ww / 2; y1 = ys - hh / 2
              x2 = xs + ww / 2; y2 = ys + hh / 2
              areas = (x2 - x1) * (y2 - y1)
              order = score[mask].argsort()[::-1]
              kept = []
              while order.size > 0:
                  i = order[0]
                  kept.append(i)
                  if order.size == 1:
                      break
                  xx1 = np.maximum(x1[i], x1[order[1:]])
                  yy1 = np.maximum(y1[i], y1[order[1:]])
                  xx2 = np.minimum(x2[i], x2[order[1:]])
                  yy2 = np.minimum(y2[i], y2[order[1:]])
                  inter = np.clip(xx2 - xx1, 0, None) * np.clip(yy2 - yy1, 0, None)
                  iou = inter / (areas[i] + areas[order[1:]] - inter + 1e-9)
                  inds = np.where(iou <= 0.5)[0]
                  order = order[inds + 1]
              return len(kept)

          print(">>> ====== 关键诊断 ======")
          for th in (0.25, 0.4, 0.5, 0.7, 0.8):
              n = nms_count(main_out, conf_th=th)
              print(f"   [onnx main output  NMS conf>{th}] = {n} 框")
          print(">>> 结论:")
          print("    - 若此处 conf=0.8 还有 >= 5 框 -> 模型权重本身有左上角幻觉")
          print("    - 若此处 conf=0.8 是 0 框 -> RKNN 上的 12 框是 INT8 量化副作用")
          print("    上面 RKNN 上你看到的 12/12，正好对照即可")
          PY

      - name: Upload .rknn as artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: rknn-model
          path: ./*.rknn
          if-no-files-found: error
          retention-days: 14
